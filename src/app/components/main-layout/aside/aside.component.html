<img
      [ngSrc]="fotoPerfil"
      width="300"
      height="300"
      priority
      alt="Foto de perfil de {{ nombre }} {{ apellidos }}"
      class="foto-perfil"
/>
<h3>{{ contacto }}</h3>
    <p><b>Ciudad:</b> {{ ciudad }}</p>
    <p><b>Telefono:</b> {{ telefono }}</p>
    <p><b>Email:</b> {{ email }}</p>
    <p><b>GitHub:</b> {{ github }}</p>
    <p><b>Idiomas:</b> {{ idiomas }}</p>
